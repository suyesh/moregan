summary:
  repository_type: Python CLI installer and Codex/Claude skill bundle
  primary_runtime_entrypoint: install.py
  package_manager: uv
  tests: Python unittest in tests/test_install.py
  no_dev_server: true
  core_assets:
    - SKILL.md defines harness workflow and mandatory persona contract.
    - install.py installs, updates, repairs, and uninstalls the skill for Claude Code and Codex.
    - personas/ contains the role instructions installed into Claude or bundled for Codex.
    - .harness/ contains default policy, knowledge, rollback, collaboration, integration, documentation, and progress artifacts.
