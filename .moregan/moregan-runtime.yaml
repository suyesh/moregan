  - id: "8"
    title: Implement dry-run worker orchestration
    status: done
    acceptance_criteria:
      - Worker adapter interfaces exist for routed persona stages.
      - The runtime writes dry-run StageResult artifacts for selected worker stages.
      - Dry-run worker artifacts are honest SKIP results and state that no provider is configured.
      - Low, medium, and high risk routes move through the StateMachine instead of bypassing worker states.
      - Medium-risk routes can complete after code review without forcing production readiness gates.
      - High-risk routes include architecture, security, production readiness, MR readiness, and learning states.
    files:
