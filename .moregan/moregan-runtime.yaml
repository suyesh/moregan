    depends_on: ["5"]
  - id: "7"
    title: Implement configurable deterministic tool layer
    status: done
    acceptance_criteria:
      - Repository-local .moregan/tools.yaml can configure deterministic commands.
      - Default deterministic commands still run when no tools file is present.
      - Built-in commands support git diff validation, Python compilation, and unittest discovery.
      - Explicit command lists can be configured without adding code.
      - Command evidence records category, required flag, duration, source, exit code, output tails, and remediation guidance.
      - Optional tool failures do not block the run but still create structured findings.
      - Stack detection writes tool_suggestions.json without running extra commands implicitly.
    files:
