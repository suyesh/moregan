      - moregan/runtime.py
      - moregan/state.py
      - tests/test_moregan_runtime.py
      - tests/test_install.py
      - README.md
      - INSTALL.md
      - ROADMAP.md
      - .moregan/roadmap.yaml
    depends_on: ["7"]
  - id: "9"
    title: Implement provider-backed local command workers
    status: done
    acceptance_criteria:
      - .moregan/workers.yaml can configure local provider commands for routed worker stages.
      - Worker commands receive run context through MOREGAN_* environment variables.
      - Worker commands must emit StageResult-compatible JSON on stdout.
      - Provider command failures, timeouts, invalid JSON, and invalid stage output become structured findings.
      - Provider command failures stop the route and move the StateMachine to failed.
      - Worker commands default to no-write mode with MOREGAN_NO_WRITE=1.
    files:
