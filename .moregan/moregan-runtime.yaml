  - id: "6"
    title: Implement runtime state machine
    status: done
    acceptance_criteria:
      - The runtime has explicit task states for intake, risk classification, planning, generation, deterministic evidence, evaluation, remediation, readiness, learning, completed, and failed paths.
      - Legal transitions are enforced in code.
      - Invalid transitions raise a dedicated error.
      - Every run writes state.json with the current state and full transition history.
      - Every run appends state snapshots to states.jsonl.
      - CLI status shows the latest run state.
    files:
