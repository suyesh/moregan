    title: Create a feature branch and define rename stance
    status: done
    acceptance_criteria:
      - Work happens on a branch separate from main.
      - MoreGAN is used as the forward-facing product name.
      - Installed skill paths are renamed to moregan.
    files:
      - README.md
      - INSTALL.md
      - SKILL.md
      - install.py
    depends_on: []
  - id: "2"
    title: Add executable runtime trace foundation
    status: done
    acceptance_criteria:
      - A MoreGAN CLI can create a run trace from an engineering request.
      - The runtime writes request, plan, event, evidence, result, and final report artifacts.
      - Risk classification maps high-risk requests to stricter routes.
      - Deterministic checks include git diff whitespace checks, Python compilation, and unittest discovery.
    files:
      - moregan/__init__.py
      - moregan/runtime.py
      - moregan/cli.py
      - .gitignore
    depends_on: ["1"]
