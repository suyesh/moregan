nickname: moregan-runtime
feature: Rename the public brand to MoreGAN and add the first executable runtime trace foundation
created: "2026-08-11"
status: done
context: The user wants to move the project toward a serious engineer-facing tool and rename it fully to MoreGAN, including the project-local workflow directory.
confidence:
  score: 72
  level: production
  rationale: The change spans docs, installer payloads, tests, project-local workflow paths, command aliases, and a new Python runtime package.
designer_decision:
  status: not_needed
  rationale: This is a CLI/runtime/docs change with no frontend UI, UX, accessibility, layout, or design-system surface.
architectural_review:
  verdict: APPROVED
  notes:
    - Use MoreGAN as the public brand, skill name, install path, command prefix, package namespace, and project-local workflow directory.
    - Add executable runtime foundations as deterministic code under moregan/ instead of burying the next product direction only in documentation.
    - Store run traces under .moregan/runs/ and ignore them in git to avoid committing local evidence artifacts by accident.
rollback_strategy:
  approach: Revert the moregan package, installer payload changes, docs rename edits, test updates, and .gitignore change as one branch patch if validation fails.
tasks:
