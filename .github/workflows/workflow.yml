name: Publish to PyPI

"on":
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'suyesh/moregan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tag, checkout, metadata and release notes
        id: release
        run: python scripts/ci/release.py --event "$GITHUB_EVENT_PATH"

  quality:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  github-release:
    needs: [preflight, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moregan-dist
          path: dist/
      - name: Create the release for this verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag \
              --title "MoreGAN $RELEASE_TAG" \
              --notes-file "docs/release-notes/${RELEASE_TAG#v}.md"
          fi

  pypi-publish:
    name: Publish the tested distributions
    needs: [preflight, quality, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/moregan
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: moregan-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
